# Dev: CSDL chính là Supabase (DATABASE_URL trong .env), không cần dịch vụ nào khác.
# Muốn chạy Postgres cục bộ (làm việc offline): pnpm db:up (docker compose --profile local-db up -d)
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: truyen
      POSTGRES_PASSWORD: truyen
      POSTGRES_DB: truyen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truyen"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  pgdata:
